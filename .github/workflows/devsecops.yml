name: Bun & Docker DevSecOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          cd mi-api && bun install
          cd ../mi-front && bun install

      - name: Run Unit Tests
        run: |
          cd mi-api
          bun test

  snyk-scan:
    name: Snyk Security & Container Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          cd mi-api && bun install
          cd ../mi-front && bun install

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk config set api=$SNYK_AUTH_TOKEN
        env:
          SNYK_AUTH_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk Open Source Test
        run: |
          snyk test --file=mi-api/package.json --severity-threshold=high
          snyk test --file=mi-front/package.json --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Build Docker Images
        run: docker compose build

      - name: Snyk Container Scan API
        run: snyk container test docker-testing-app --severity-threshold=high || true

  sonar-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: snyk-scan
    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SonarCloud configuration
        id: sonar_check
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN secret is missing. Skipping Sonar scan."
            echo "run_scan=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${SONAR_PROJECT_KEY}" ] || [ -z "${SONAR_ORGANIZATION}" ]; then
            echo "SONAR_PROJECT_KEY or SONAR_ORGANIZATION variable is missing. Skipping Sonar scan."
            echo "run_scan=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Using Sonar project key: ${SONAR_PROJECT_KEY}"
          echo "Using Sonar organization: ${SONAR_ORGANIZATION}"

          STATUS=$(curl -s -o /tmp/sonar_component.json -w "%{http_code}" \
            -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/components/show?component=${SONAR_PROJECT_KEY}")

          if [ "${STATUS}" != "200" ]; then
            echo "Sonar token/project validation failed with HTTP ${STATUS}. Skipping Sonar scan."
            echo "run_scan=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run_scan=true" >> "$GITHUB_OUTPUT"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Scan skipped
        if: steps.sonar_check.outputs.run_scan != 'true'
        run: echo "Skipping SonarCloud analysis because token, organization, or project key is not valid for this repository."

      - name: SonarCloud Scan
        if: steps.sonar_check.outputs.run_scan == 'true'
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.sources=mi-api/src,mi-front
            -Dsonar.javascript.environments=browser,node
            -Dsonar.exclusions=**/node_modules/**,**/bun.lock
