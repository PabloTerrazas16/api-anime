name: Bun & Docker DevSecOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          cd mi-api && bun install
          cd ../mi-front && bun install

      - name: Run Unit Tests
        run: |
          cd mi-api
          bun test

  snyk-scan:
    name: Snyk Security & Container Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          cd mi-api && bun install
          cd ../mi-front && bun install

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk config set api=$SNYK_AUTH_TOKEN
        env:
          SNYK_AUTH_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk Open Source Test
        run: |
          snyk test --file=mi-api/package.json --severity-threshold=high
          snyk test --file=mi-front/package.json --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Build Docker Images
        run: docker compose build

      - name: Snyk Container Scan API
        run: snyk container test docker-testing-app --severity-threshold=high || true

  sonar-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: snyk-scan
    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'unidasp-1_docker-testing' }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'unidasp-1' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SonarCloud configuration
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "Missing SONAR_TOKEN secret. Configure it in repository Secrets and variables > Actions."
            exit 1
          fi

          echo "Using Sonar project key: ${SONAR_PROJECT_KEY}"
          echo "Using Sonar organization: ${SONAR_ORGANIZATION}"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.sources=mi-api/src,mi-front
            -Dsonar.javascript.environments=browser,node
            -Dsonar.exclusions=**/node_modules/**,**/bun.lock
